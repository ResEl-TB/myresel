---
exclusions:
  - apt
  - disks

campuses:
  - name: brest
    enabled: true
    connections:
      - start: quantic-brest
        end: network-edge
      - start: internet-access
        end: kim
      - start: kim
        end: kuma
      - start: kuma
        end: network-access
    services:
      internet-access:
        - name: quantic-brest
          title: Ielo
          text: La fibre Ielo est la connexion principale du ResEl
          icon: fa-cloud
          essential: false
          level: 2
          _hosts:
            - gw-ielo-br
        - name: moji-brest
          title: Moji
          text: La fibre Moji est la connexion de secours du ResEl
            sur le campus de Brest
          icon: fa-cloud
          essential: false
          level: 1
          _hosts:
            - gw-moji-br
      network-edge:
        - name: kim
          title: Firewall
          text: Le firewall principal à Brest. Il permet de
            contrôler l’accès à Internet.
          icon: fa-server
          essential: true
          level: 1
          _hosts:
            - kim
      network-core:
        - name: kuma
          title: Routeur de coeur
          text: Kuma est le routeur de coeur du campus de Brest, il permet de
            router les packets entre les différents réseaux du campus.
          icon: fa-circle-o
          essential: true
          level: 2
          _hosts:
            - kuma
      rescue-stack:
        - name: radius2
          title: RADIUS de secours
          text: Le RADIUS de secours permet l’authentification en Wi-Fi et en
            filaire en cas de panne du RADIUS principal.
          icon: fa-wifi
          essential: false
          level: 1
          _hosts:
            - the-ting-goes-skrrrahh
        - name: dhcp2
          title: DHCP de secours
          text: Le DHCP de secours permet d’attribuer des adresses
            IP si le DHCP principal est en panne.
          icon: fa-legal
          essential: false
          level: 2
          _hosts:
            - and-a-pu-pu-pudrrrr-boom
        - name: dns2
          title: DNS de secours
          text: Le DNS de secours permet de convertir les noms de domaine
            en adresses IP si le serveur principal est en panne.
          icon: fa-book
          essential: false
          level: 2
          _hosts:
            - anakin-bck-br
            - luke-bck-br
            - chewbacca-bck-br
            - darthvader-bck-br
            - palpatine-bck-br
      main-stack:
        - name: radius
          title: RADIUS principal
          text: Le RADIUS permet l’authentification en Wi-Fi et en filaire.
          icon: fa-wifi
          essential: true
          level: 2
          _hosts:
            - shai-hulud
        - name: dns
          title: DNS principal
          text: Le DNS principal permet de convertir les noms de domaine
            en adresses IP.
          icon: fa-book
          essential: true
          level: 1
          _hosts:
            - anakin
            - luke
            - chewbacca
            - darthvader
            - palpatine
        - name: dhcp
          title: DHCP principal
          text: Le DHCP principal permet d’attribuer des adresses
            IP aux appareils qui se connectent.
          icon: fa-legal
          essential: true
          level: 2
          _hosts:
            - zephyr
        - name: ldap
          title: LDAP
          text: Le LDAP est la base de données principale au ResEl.
          icon: fa-address-book
          essential: true
          level: 2
          _hosts:
            - edvige
        - name: mysql
          title: MariaDB
          text: La base de données MariaDB contient toutes les informations
            non-essentielles au fonctionnement du ResEl.
          icon: fa-database
          essential: false
          level: 1
          _hosts:
            - lena
        - name: monitoring
          title: Monitoring
          text: Les services de monitoring permettent aux administrateurs de
            bien vérifier l’état du réseau.
          icon: fa-area-chart
          essential: false
          level: 0
          _hosts:
            - reaper
            - elliot
        - name: web
          title: Sites web
          text: Le ResEl héberge différents services web afin de faciliter
            les opérations de l’associations et des clubs.
          icon: fa-internet-explorer
          essential: false
          level: 0
          _hosts:
            - flea
            - skynet
            - teia
            - chamoix
        - name: tv
          title: Télévision
          text: Le service de télévision permet de regarder les chaines de la TNT depuis le réseau du ResEl.
          icon: fa-television
          essential: false
          level: 0
          _hosts:
            - rebirth
            - quadria
        - name: backup
          title: Sauvegarde principale
          text: Le système de sauvegarde est essentiel en cas d’incident majeur afin de récupérer les données.
          icon: fa-floppy-o
          essential: false
          level: 1
          _hosts:
            - xana
        - name: mail
          title: Mails
          text: Le service de couriel permet l’hébergement des listes de
            diffusions essentiels aux clubs du campus.
          icon: fa-envelope
          essential: true
          level: 1
          _hosts:
            - amateria
