# TODO: refactor configuration (username, pass...)
# TODO: do not delete migrations

variables:
 IMAGE: $CI_REGISTRY_IMAGE
 DOCKER_DRIVER: overlay2
  
 IMAGE_TAG: latest

 MYSQL_HOST: mariadb
 MYSQL_USER: resel
 MYSQL_PASSWORD: blah
 MYSQL_DATABASE: resel
 MYSQL_ROOT_PASSWORD: blah
 MYSQL_ROOT_HOST: '%'

 REDIS_HOST: redis

 MYSQL_QOS_DATABASE: qos
 MYSQL_QOS_HOST: mariadb
 MYSQL_QOS_USER: root
 MYSQL_QOS_PASSWORD: blah

 ROOTDIR: ./
 CONFDIR: myresel/
 ETCDIR: .install/etc/
 LIBDIR: .install/lib/
 LDAP_PASSWORD: blah

 LAPUTEX_HOST: http:\/\/laputex\/
 #LAPUTEX_PWD in gitlab secrets

 DEBIAN_FRONTEND: noninteractive

# image built by this pipeline when the Dockerfile changes, latest otherwise
workflow:
  rules:
    # branch pipelines only: build jobs (only: changes) never run in MR pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - changes:
        - Dockerfile
      variables:
        IMAGE_TAG: $CI_COMMIT_SHA
    - when: always

image: $IMAGE:$IMAGE_TAG
services:
  - redis:8.10
  # same versions as flea (preprod)
  - name: mariadb:13.0
    alias: mariadb
    # flea's myresel database is utf8mb4_general_ci, not the 11.8 server default (uca1400)
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]

stages:
  - docker_build
  - docker_push
  - configure
  - test
  - deploy

before_script:
#  - source .install/scripts/install_essentials.sh no-upgrade
  - source .install/scripts/install_essentials.sh
  - apt-get install -qq default-mysql-client
  - echo "CREATE DATABASE ${MYSQL_QOS_DATABASE}" | mysql -u${MYSQL_QOS_USER} -p${MYSQL_QOS_PASSWORD} -h ${MYSQL_QOS_HOST}
  - source .install/scripts/install_openldap.sh
#  - source .install/scripts/install_latex.sh
  - pip3 install --break-system-packages -qUr requirements.txt
  - rm -f -- ${ROOTDIR}myresel/settings_local.py
  - export MYSQL_USER=root
  - source .install/scripts/configure.sh
  - source .install/scripts/populate_db.sh
  - python3 manage.py populate_redis
  - python3 manage.py calculate_free_ip
  - python3 manage.py rqworker &
  - python3 manage.py rqscheduler &

Build docker image:
  stage: docker_build
  image: $DOCKER_IMAGE
  services:
      - name: $RUNNER_IMAGE
        alias: docker
  before_script: &before_script
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE:$CI_COMMIT_SHA --build-arg LDAPPASSWD=$LDAP_PASSWORD .
    - docker push $IMAGE:$CI_COMMIT_SHA
  only:
   changes:
     - Dockerfile
  tags:
    - admin


Push docker image:
  stage: docker_push
  image: $DOCKER_IMAGE
  services:
      - name: $RUNNER_IMAGE
        alias: docker
  before_script: *before_script
  script:
    - docker pull $IMAGE:$CI_COMMIT_SHA
    - docker tag $IMAGE:$CI_COMMIT_SHA $IMAGE:latest
    - docker push $IMAGE:latest
  only:
   refs:
     - master
   changes:
     - Dockerfile
  tags:
    - admin

django test suite:
  stage: test
  artifacts:
    paths:
      - htmlcov/
      - myresel/settings_local.py
      - wiki/migrations/
      - tresorerie/migrations/
      - pages/migrations/
      - gestion_personnes/migrations/
      - devices/migrations/
  script:
    - echo "CREATE DATABASE test_${MYSQL_DATABASE}" | mysql -u${MYSQL_USER} -p${MYSQL_ROOT_PASSWORD} -h ${MYSQL_HOST}
    - >-
      DJANGO_SETTINGS_MODULE=myresel.settings python3 -c "import django; django.setup();
      from django.db import connection; from django.core.management import call_command;
      connection.settings_dict['NAME'] = 'test_${MYSQL_DATABASE}';
      call_command('migrate', verbosity=0);
      connection.cursor().execute('ALTER TABLE tresorerie_product CONVERT TO CHARACTER SET utf8mb3 COLLATE utf8mb3_general_ci')"
    - coverage run --rcfile=.coveragerc manage.py test --noinput --keepdb
    - coverage report
    - coverage html
    - grep pc_cov htmlcov/index.html | egrep -o "[0-9]+\%" | awk '{ print "covered " $1;}'
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

python linting:
  stage: test
  script:
    - pylint --rcfile=.pylintrc --django-settings-module=myresel.settings fonctions gestion_personnes ldapback maisel myresel pages tresorerie wiki || exit $((35 & $?))
  allow_failure: false

deploy to staging:
  services: []
  before_script:
    - apt-get install -qq openssh-client
    - eval $(ssh-agent -s)
    - bash -c 'ssh-add <(echo "${STAGING_DEPLOY_KEY}")'
  stage: deploy
  script:
    - ssh -o "StrictHostKeyChecking=no" -T deploy@flea
  only:
    - master
  environment:
    name: staging flea
    url: https://dev.resel.fr/
  tags:
    - admin

deploy to brest:
  stage: deploy
  services: []
  before_script:
    - apt-get install -qq openssh-client
    - eval $(ssh-agent -s)
    - bash -c 'ssh-add <(echo "${SKYNET_DEPLOY_KEY}")'
  script:
    - ssh -o "StrictHostKeyChecking=no" -T deploy@skynet
  only:
    - deploy
  environment:
    name: skynet
    url: https://resel.fr/
  tags:
    - admin

deploy to rennes:
  stage: deploy
  services: []
  allow_failure: true
  before_script:
    - apt-get install -qq openssh-client
    - eval $(ssh-agent -s)
    - bash -c 'ssh-add <(echo "${DOUBIDOU_DEPLOY_KEY}")'
  script:
    - ssh -o "StrictHostKeyChecking=no" -T deploy@doubidou
  only:
    - deploy
  environment:
    name: doubidou
    url: https://rennes.resel.fr/
  tags:
    - admin
